# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml/

authors = ["oss@fastly.com"]
description = "Fanout chat workshop edge code"
language = "javascript"
manifest_version = 3
name = "fanout-chat-workshop-edge"

[scripts]
build = "npm run build"

# Run Pushpin alongside the local dev server so that createFanoutHandoff()
# actually works on this machine. Pushpin is the open-source GRIP proxy that
# Fanout is built on, so it stands in for Fanout locally.
#
# Requires the Fastly CLI >= 13.1.0 and a `pushpin` binary on $PATH — the
# devcontainer installs one for you.
[local_server.pushpin]
enable = true

# The Django backend. `override_host` makes the request arrive at Django with a
# Host header it accepts (see ALLOWED_HOSTS in origin/server/settings.py).
[local_server.backends.origin]
url = "http://127.0.0.1:3000/"
override_host = "127.0.0.1:3000"
